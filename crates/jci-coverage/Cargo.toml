[package]
name = "jci-coverage"
version = "0.0.20"
description = "Complexity and CRAP scores for cargo-llvm-cov coverage reports, with upload to OtterWise for code quality reporting"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# cargo-about tooling config: needed to regenerate THIRD-PARTY-LICENSES.md but
# not part of the distributed crate.
exclude = ["about.toml", "about.hbs"]

[dependencies]
# CLI
clap.workspace = true
clap-verbosity-flag.workspace = true

# Error Handling
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

# complexity: Rust source parsing and Cobertura rewriting
syn.workspace = true
proc-macro2.workspace = true
quick-xml.workspace = true
lcov2cobertura.workspace = true

# upload: git metadata + OtterWise HTTP client
git2.workspace = true
reqwest.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
trycmd.workspace = true

[[bin]]
name = "jci-coverage"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/jci-coverage-v{ version }/jci-coverage-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-binstall signature verification. The pubkey is a placeholder in source:
# the release pipeline generates an ephemeral minisign/rsign keypair, signs the
# tarball, and `pcu release inject-pubkey` replaces the `pubkey` value below with
# that release's public key before the crate is published. Without this section
# pcu has nothing to replace and the signature is published unverifiable.
[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSqZQllckZiwUJRpSqZ9ZZNZwGLph6Tszhr35vF1UI4mNeUTzV791dB"
