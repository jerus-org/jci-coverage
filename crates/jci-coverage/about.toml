# cargo-about configuration for generating THIRD-PARTY-LICENSES.md.
#
# The `accepted` list is DERIVED from the canonical ../../deny.toml [licenses]
# policy by `jci-audit sync`, scoped down to the licenses this crate's own
# dependency graph actually carries — not a copy of deny.toml's full
# workspace-wide allow list. `jci-audit sync --check` fails on drift without
# writing. Everything else in this file — this comment and
# `ignore-dev-dependencies` — is hand-authored and untouched by `sync`.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Notices cover what ships in the binary: dev-only dependencies (test
# harness, etc.) are not distributed, so they are excluded.
ignore-dev-dependencies = true
