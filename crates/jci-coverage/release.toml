pre-release-commit-message = "chore: Release jci-coverage v{{version}}"
tag-message = "{{tag_name}}"
tag-name = "jci-coverage-v{{version}}"
pre-release-hook = ["./release-hook.sh"]
# jci-coverage ships as a binary (installed via cargo-binstall), not a library
# dependency, so there is no `jci-coverage = "x.y.z"` version string to
# rewrite in the README — mirrors jci-audit's binary convention.
pre-release-replacements = []
