version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.89"

orbs:
  toolkit: jerus-org/circleci-toolkit@8.0.3

  orb-tools: circleci/orb-tools@12.5.0
  # Dogfood: this repo's own coverage runs through its published orb.
  jci-coverage: jerus-org/jci-coverage@0.0.7
  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.2.4
  # <<< gen-circleci-orb
jobs:
  # toolkit/test_doc_build hardcodes `cargo doc --lib`, which fails on
  # jci-coverage: deliberately bin-only, no [lib] target (nothing depends on
  # this crate as a library, so publishing one would misrepresent it on
  # crates.io/docs.rs — see the P0 PR). Mirrors that job's shape without
  # --lib, per the org's "prototype in the requiring repo, propose upstream
  # once validated" policy for toolkit gaps. Proposed upstream as
  # digital-prstv/circleci-toolkit#525 (a lib_only param); switch back to
  # toolkit/test_doc_build once that lands.
  test_doc_build:
    executor: toolkit/rust_env_rolling
    resource_class: medium
    environment:
      RUSTDOCFLAGS: --cfg docsrs -Dwarnings
    steps:
      - checkout
      - run:
          name: Record compiler version for cache key
          command: rustc +nightly --version > rust-toolchain-version.txt
      - restore_cache:
          name: Restore dependency cache
          keys:
            - deps-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - deps-v1-{{ arch }}-
      - restore_cache:
          name: Restore build cache
          keys:
            - build-v1-{{ arch }}-{{ checksum "rust-toolchain-version.txt" }}-{{ checksum "Cargo.lock" }}
            - build-v1-{{ arch }}-{{ checksum "rust-toolchain-version.txt" }}-
            - build-v1-{{ arch }}-
      - run:
          name: Test generation of all of the documentation for the crate
          command: |
            cargo +nightly doc \
            --no-deps \
            --all-features \
            --document-private-items
      - save_cache:
          name: Save dependency cache
          key: deps-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
      - save_cache:
          name: Save build cache
          key: build-v1-{{ arch }}-{{ checksum "rust-toolchain-version.txt" }}-{{ checksum "Cargo.lock" }}
          paths:
            - target

workflows:
  validation:
    jobs:
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/

      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>

      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main

      - test_doc_build:
          filters:
            branches:
              ignore: main

      - toolkit/idiomatic_rust:
          clippy_report: true

      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>

      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/security:
          name: security with sonarcloud
          clippy_report: true
          no_sonarcloud_on_main: false
          requires:
            - toolkit/idiomatic_rust
          context: SonarCloud
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/

      # Dogfooding (P4, #16): coverage via this crate's own orb, replacing
      # toolkit/code_coverage. Needs OTTERWISE_TOKEN set as a project
      # environment variable, so forked-PR builds (/pull/N, no secrets) are
      # skipped.
      - jci-coverage/report_and_upload:
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
      # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
      - gen-circleci-orb/build_rust_binary:
          name: build-binary
          package: jci-coverage
          executor: toolkit/rust_env_rolling
          filters:
            branches:
              ignore:
                - /^renovate\/.*$/
      - gen-circleci-orb/generate:
          name: regenerate-orb
          binary: jci-coverage
          orb_namespace: jerus-org
          orb_dir: orb
          attach_workspace: true
          ssh_fingerprint: "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
          persist_orb_workspace: true
          context: [release]
          requires: [build-binary, toolkit/common_tests]
          filters:
            branches:
              ignore:
                - main
                - /^renovate\/.*$/
      - gen-circleci-orb/update:
          name: check-ci-wiring
          check: true
          filters:
            branches:
              ignore:
                - main
      - orb-tools/pack:
          name: pack-orb
          checkout: false
          source_dir: orb/src
          pre-steps:
            - attach_workspace:
                at: .
          requires: [regenerate-orb]
          filters:
            branches:
              ignore:
                - main
                - /^renovate\/.*$/
      - orb-tools/review:
          name: review-orb
          checkout: false
          source_dir: orb/src
          pre-steps:
            - attach_workspace:
                at: .
          requires: [pack-orb]
          filters:
            branches:
              ignore:
                - main
                - /^renovate\/.*$/
      # <<< gen-circleci-orb

  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  orb-release:
    jobs:
      - orb-tools/pack:
          name: orb-release-pack
          checkout: false
          source_dir: orb/src
          pre-steps:
            - checkout
            - run:
                name: Inject release version into executor default tag
                command: |
                  VERSION=${CIRCLE_TAG#jci-coverage-v}
                  echo "Injecting version: ${VERSION}"
                  sed -i "s/default: latest/default: ${VERSION}/" orb/src/executors/default.yml
                  echo "Updated executor:"
                  cat orb/src/executors/default.yml
          filters:
            tags:
              only: /^jci-coverage-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/build_container:
          name: orb-release-container
          binary: jci-coverage
          docker_namespace: jerusdp
          orb_dir: orb
          crate_tag_prefix: jci-coverage-v
          context: [docker]
          filters:
            tags:
              only: /^jci-coverage-v.*/
            branches:
              ignore: /.*/

      - gen-circleci-orb/ensure_orb_registered:
          name: orb-release-ensure-registered-jerus-org
          orb_name: jerus-org/jci-coverage
          context: [orb-publishing]
          filters:
            tags:
              only: /^jci-coverage-v.*/
            branches:
              ignore: /.*/

      - orb-tools/publish:
          name: publish-orb-jerus-org
          pre-steps:
            - run:
                name: Normalize CIRCLE_TAG for orb version
                command: |
                  VERSION=${CIRCLE_TAG#jci-coverage-v}
                  echo "export CIRCLE_TAG=v${VERSION}" >> "$BASH_ENV"
          orb_name: jerus-org/jci-coverage
          pub_type: production
          vcs_type: github
          enable_pr_comment: false
          requires: [orb-release-container, orb-release-pack, orb-release-ensure-registered-jerus-org]
          context: [orb-publishing]
          filters:
            tags:
              only: /^jci-coverage-v.*/
            branches:
              ignore: /.*/
  # <<< gen-circleci-orb
