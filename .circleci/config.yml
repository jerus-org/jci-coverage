version: 2.1

parameters:
  min_rust_version:
    type: string
    default: "1.89"

orbs:
  toolkit: jerus-org/circleci-toolkit@7.2.0

jobs:
  # deny.toml is the single source of truth for both .cargo/audit.toml and
  # every crate's about.toml (cargo-about's license-policy config); this
  # catches drift between them at PR time.
  #
  # Deliberately NOT also checking that cargo-about can actually RESOLVE the
  # licences (a real, distinct failure mode `jci-audit check`/`sync --check`
  # don't cover — see jerus-org/jci-audit#80). jci-audit's own `release` gate
  # already does that resolvability check at release time, and #80 proposes
  # folding it into `jci-audit check` too; a hand-rolled `cargo-about
  # generate --output-file /dev/null` PR-time script (as jci-audit's own repo
  # currently carries, pending #80) would just be a workaround to delete
  # again once that lands — not worth building fresh into a brand-new repo.
  #
  # jci-audit is not (yet) baked into the shared rust_env_rolling image — see
  # circleci-toolkit's CI Container Philosophy — so it is cargo-binstalled
  # here for now, the same prototype-before-promotion step every new CI tool
  # takes before it earns a place in the image or a consumable orb.
  licenses_policy:
    executor: toolkit/rust_env_rolling
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install jci-audit
          command: cargo binstall --no-confirm jci-audit
      - run:
          name: Check deny.toml-derived files are in sync
          command: jci-audit sync --check

workflows:
  validation:
    jobs:
      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_trusted
          context: bot-check
          post_comment: true
          update_pcu: false
          filters:
            branches:
              ignore:
                - main
                - /pull\/[0-9]+/

      - toolkit/verify_commit_signatures:
          name: verify_commit_signatures_forked
          post_comment: false
          update_pcu: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/required_builds:
          min_rust_version: << pipeline.parameters.min_rust_version >>

      - toolkit/optional_builds:
          filters:
            branches:
              ignore: main

      - toolkit/test_doc_build:
          filters:
            branches:
              ignore: main

      - toolkit/idiomatic_rust:
          clippy_report: true

      - toolkit/common_tests:
          min_rust_version: << pipeline.parameters.min_rust_version >>
      - licenses_policy

      - toolkit/security:
          name: security audit only
          sonarcloud: false
          filters:
            branches:
              only:
                - /pull\/[0-9]+/

      - toolkit/security:
          name: security with sonarcloud
          clippy_report: true
          no_sonarcloud_on_main: false
          requires:
            - toolkit/idiomatic_rust
          context: SonarCloud
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/

      - toolkit/code_coverage:
          context: SonarCloud
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
                - main

