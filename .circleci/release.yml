version: 2.1

parameters:
  jci_coverage_version:
    type: string
    default: ""
    description: "Override jci-coverage crate version (empty = nextsv auto-detect)"
  workspace_version:
    type: string
    default: ""
    description: "Override workspace v* version (empty = nextsv auto-detect)"

orbs:
  toolkit: jerus-org/circleci-toolkit@8.0.3
  orb-tools: circleci/orb-tools@12.5.0
  # Dogfood: the coverage jobs below use this crate's own published orb.
  jci-coverage: jerus-org/jci-coverage@0.0.20
  # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
  gen-circleci-orb: jerus-org/gen-circleci-orb@0.2.7
  # <<< gen-circleci-orb
commands:
  # Move to the commit the report job covered, and label what is uploaded as
  # main. The commit hash comes from the first job through the workspace, so
  # both jobs cover the same commit even if main moves in between. An empty
  # hash means the first job found nothing to cover.
  cover_the_reported_commit:
    steps:
      - run:
          name: Move to the commit the report covers
          command: |
            if [ ! -s /tmp/workspace/coverage/head-sha ]; then
              echo "Nothing was covered - nothing to do."
              circleci-agent step halt
              # halt ends the job after this step; the script itself keeps running.
              exit 0
            fi
            sha="$(cat /tmp/workspace/coverage/head-sha)"
            git fetch origin main
            git checkout -B main "$sha"
            git log -1 --format='Covering the head of main: %h %s'
            # Label the upload as main, not as whatever this pipeline was started for.
            {
              echo 'export CIRCLE_BRANCH=main'
              echo 'unset CIRCLE_PULL_REQUEST CIRCLE_PULL_REQUESTS CI_PULL_REQUEST CIRCLE_PR_NUMBER'
            } >> "$BASH_ENV"

jobs:
  # Coverage for the head of main after a release (#75). The release ends with
  # `toolkit/release_prlog`, whose `chore: update prlog for release … [skip ci]`
  # commit becomes the head of main with no coverage: validation does not
  # upload for main, and the update_prlog pipeline does not run for it (it
  # follows a merged pull request). These two jobs run after `release_prlog`
  # and upload coverage for that head, as the jobs of update_prlog.yml do for a
  # merge: the first writes the lcov report in the workspace's own executor (the
  # orb's image carries no Rust toolchain) and records which commit it covered;
  # the second converts the report, adds complexity and uploads it. The first
  # finds nothing to cover unless the head is a prlog commit, and records that
  # too, so a commit is never uploaded twice.
  coverage_report_on_release_head:
    executor: toolkit/rust_env_rolling
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Move to the head of main, if it is the prlog commit
          command: |
            mkdir -p coverage
            : > coverage/head-sha
            git fetch origin main
            subject="$(git log -1 --format=%s origin/main)"
            case "$subject" in
              "chore: update prlog"*) ;;
              *)
                echo "The head of main is not a prlog commit ($subject) - nothing to do."
                exit 0
                ;;
            esac
            git checkout -B main origin/main
            git log -1 --format='Covering the head of main: %h %s'
            git rev-parse HEAD > coverage/head-sha
      - run:
          name: Write the lcov coverage report
          command: |
            if [ ! -s coverage/head-sha ]; then
              echo "Nothing to cover."
              exit 0
            fi
            cargo llvm-cov --lcov --output-path coverage/lcov.info --all-features
      - persist_to_workspace:
          root: .
          paths:
            - coverage
  coverage_on_release_head:
    executor: jci-coverage/default
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - cover_the_reported_commit
      # An lcov report is annotated into a Cobertura report, which is written to
      # coverage/cobertura.xml (the default output for an lcov input).
      - jci-coverage/complexity:
          file: /tmp/workspace/coverage/lcov.info
      - jci-coverage/upload:
          file: coverage/cobertura.xml

workflows:
  release:
    jobs:
      - toolkit/calculate_versions:
          name: calculate-versions
          verify_tools: true
          crates: "jci-coverage:jci-coverage-v"
          crate_version_overrides: "jci-coverage:<< pipeline.parameters.jci_coverage_version >>"
          workspace_version_override: << pipeline.parameters.workspace_version >>

      - approve-release:
          type: approval
          # release-gate-review-orb: the orb about to be released is checked,
          # packed and reviewed before approval (gen-circleci-orb#462).
          requires: [calculate-versions, release-gate-review-orb]

      - toolkit/release_crate:
          name: release-jci-coverage
          requires: [approve-release]
          package: jci-coverage
          crate_tag_prefix: jci-coverage-v
          build_binary: true
          binary_name: jci-coverage
          # Required on repos with GitHub Immutable Releases: without it, the
          # binary tarball/.sig uploads fail against an already-published
          # release. See digital-prstv/circleci-toolkit#520/#521.
          draft: true
          context:
            - release
            - bot-check
            - pcu-app

      - toolkit/release_prlog:
          requires: [release-jci-coverage]
          context:
            - release
            - bot-check
            - pcu-app

      - coverage_report_on_release_head:
          name: coverage-report-on-release-head
          requires: [toolkit/release_prlog]
      - coverage_on_release_head:
          name: coverage-on-release-head
          requires: [coverage-report-on-release-head]
      # >>> gen-circleci-orb (managed — edits overwritten by 'gen-circleci-orb update')
      - gen-circleci-orb/build_rust_binary:
          name: release-gate-build-binary
          package: jci-coverage
          executor: toolkit/rust_env_rolling
      - gen-circleci-orb/generate:
          name: release-gate-check-orb
          binary: jci-coverage
          orb_namespace: jerus-org
          orb_dir: orb
          attach_workspace: true
          check: true
          requires: [release-gate-build-binary]
      - orb-tools/pack:
          name: release-gate-pack-orb
          source_dir: orb/src
          requires: [release-gate-check-orb]
      - orb-tools/review:
          name: release-gate-review-orb
          source_dir: orb/src
          requires: [release-gate-pack-orb]
      # <<< gen-circleci-orb
