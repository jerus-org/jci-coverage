version: 2.1

# Weekly check that OtterWise's own uploader (https://otterwise.app/bash) still
# posts the form fields that crates/jci-coverage/tests/otterwise_reference_fields.txt
# records (#40). The unit tests compare what `upload` sends with that file, so
# they cannot see an upstream change; this fetches the live script.
#
# Runs only from a scheduled pipeline, not on a push: an upstream change should
# fail a scheduled run and not an unrelated pull request. CircleCI scheduled
# pipelines are a project setting, not part of this file. Create the trigger in
# Project Settings -> Triggers -> Add Trigger -> Scheduled:
#   - Config file path: .circleci/otterwise_drift.yml
#   - Branch: main
#   - Frequency: weekly
# On a difference the job opens one GitHub issue (not again while it is open)
# and fails the run. The token comes from the bot-check context, as the commit
# signature check and the pull request comment use it.

jobs:
  check_otterwise_uploader:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Compare OtterWise's uploader with the manifest
          command: scripts/report-otterwise-drift.sh

workflows:
  otterwise_uploader_drift:
    jobs:
      - check_otterwise_uploader:
          context: bot-check
