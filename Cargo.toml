[workspace]
members = ["crates/jci-coverage"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Jeremiah Russell <jrussell@jerus.ie>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jerus-org/jci-coverage"
rust-version = "1.89"
keywords = ["coverage", "llvm-cov", "otterwise", "circleci", "orb"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# CLI
# wrap_help: without it, clap's help wrapping is a no-op regardless of
# `term_width` — the wrapping algorithm itself is compiled out.
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
# Verbosity flags, matching the organisation's other CLIs (jci-audit). The
# tracing feature rather than the default log one, to match this crate's
# logging stack.
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }

# Error Handling
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-log = "0.2.0"

# Git metadata for the OtterWise upload payload. No network git ops (only
# local reads of the already-checked-out repo), so the default features
# (which drop TLS/SSH backends as of git2 0.21) are fine as-is.
git2 = "0.21.0"

# HTTP client for the OtterWise multipart upload. rustls (not the default
# native-tls), matching pcu's convention org-wide.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "blocking",
    "multipart",
] }

# Commit timestamp formatting (RFC3339) for the OtterWise payload.
time = { version = "0.3.44", features = ["formatting"] }

# Testing
tempfile = "3.27.0"
trycmd = "1.2.1"
