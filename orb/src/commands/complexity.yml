description: 'Computes the cyclomatic complexity of the Rust functions a Cobertura report covers and writes it into each method, where OtterWise reads it for its Complexity and CRAP scores. `cargo llvm-cov` leaves every complexity at 0. Reads the source files the report names, relative to `--source-root`, and needs no other tool. Rust only: it refuses a report that is not a `cargo llvm-cov` Cobertura report of `.rs` files. Run it after `report` has written one, and before `upload`.'
parameters:
  file:
    type: string
    description: Cobertura report to annotate. The Cobertura file `report` writes.
    default: coverage/cobertura.xml
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
  output:
    type: string
    description: Write the annotated report here instead of over `--file`. The default replaces the report in place; a failed run never leaves a half-written file.
    default: ''
  source_root:
    type: string
    description: Directory the report's source file paths are relative to
    default: .
  duplicates:
    type: enum
    description: What to do with the several entries `cargo llvm-cov` writes for one generic function
    default: merge
    enum:
    - merge
    - keep
  rules:
    type: enum
    description: Which decision points count
    default: rca
    enum:
    - rca
    - mccabe
  unmatched:
    type: enum
    description: What to do with a method that has no matching function in the source
    default: keep
    enum:
    - keep
    - one
    - fail
  no_rollup:
    type: boolean
    description: Leave the class, package and root complexity as they are. By default they are set to the sum of the methods below them, so other Cobertura consumers see consistent data. OtterWise ignores them.
    default: false
  exclude_tests:
    type: boolean
    description: Count `#[cfg(test)]` code and `#[test]` functions as complexity 0
    default: false
  warn_complexity:
    type: string
    description: Warn about each function whose cyclomatic complexity is at least this. A per-line average can hide a few very risky functions among many simple ones. 0 turns the check off.
    default: '10'
  warn_crap:
    type: string
    description: Warn about each function whose CRAP score is at least this. CRAP is complexity squared times the uncovered share cubed, plus complexity, from the covered share of the function's own lines. 0 turns the check off.
    default: '30'
  max_complexity:
    type: string
    description: Fail if any function's cyclomatic complexity is at least this. The report is written first (not with `--dry-run`, which still fails). 0 turns the check off.
    default: '0'
  max_crap:
    type: string
    description: Fail if any function's CRAP score is at least this. A function with no executable lines has no CRAP score and never fails this. 0 turns the check off.
    default: '0'
  baseline:
    type: string
    description: '[<PATH>] Let the functions listed in this file stay over a maximum. A function in the baseline fails only if it has got worse than it was recorded in a score that is over its maximum (a CRAP that moves while under `--max-crap` does not fail a function accepted for its complexity). It is still warned about. Without a value it reads `.jci-coverage-baseline` in the directory this runs from, by convention the repository root. Make the file with `--write-baseline`; it is a binary file for this tool, not meant to be edited.'
    default: ''
  write_baseline:
    type: string
    description: '[<PATH>] Record the functions now over a maximum in this file, and do not fail. Needs `--max-complexity` or `--max-crap`. Without a value it writes `.jci-coverage-baseline` in the directory this runs from, by convention the repository root. Nothing is written with `--dry-run`.'
    default: ''
  summary_file:
    type: string
    description: 'Write a short markdown summary of the gate result to this file. The failing functions (or that the gate passes) in a form for a pull request comment: the headline, a compact table, and a pointer to the CI log. Written only when requested, when a maximum is set, after the report; nothing is written with `--dry-run` or `--write-baseline`. A failure to write it is a warning and does not change the result.'
    default: ''
  pr_comment:
    type: boolean
    description: Post the gate summary as a comment on the pull request. The same summary as `--summary-file`, posted to the pull request this build is for (from `CIRCLE_PULL_REQUEST`), using the token in `GITHUB_TOKEN`. An earlier comment from this tool is edited in place, otherwise one is created, whether the gate passes or fails, so the pull request shows that the gate ran. Nothing is posted, and a reason is logged, when there is no token or no pull request, or the pull request is from a fork. A failure to post is a warning and does not change the result.
    default: false
  gate_tests:
    type: boolean
    description: Judge test code against the warning and maximum thresholds too
    default: false
  check_only:
    type: boolean
    description: Only run the maximum and baseline checks, and leave the report as it is. For a gate step after `upload`, so a failure comes after the upload and not before it. The report is not rewritten and the summary and warnings, which the annotating step has already given, are not repeated. With no maximum set there is nothing to check and it succeeds.
    default: false
  dry_run:
    type: boolean
    description: Work out and print the summary without writing anything
    default: false
steps:
- when:
    condition: << parameters.no_rollup >>
    steps:
    - run:
        name: Set GCO_NO_ROLLUP flag
        command: echo 'export GCO_NO_ROLLUP=true' >> "$BASH_ENV"
- when:
    condition: << parameters.exclude_tests >>
    steps:
    - run:
        name: Set GCO_EXCLUDE_TESTS flag
        command: echo 'export GCO_EXCLUDE_TESTS=true' >> "$BASH_ENV"
- when:
    condition: << parameters.pr_comment >>
    steps:
    - run:
        name: Set GCO_PR_COMMENT flag
        command: echo 'export GCO_PR_COMMENT=true' >> "$BASH_ENV"
- when:
    condition: << parameters.gate_tests >>
    steps:
    - run:
        name: Set GCO_GATE_TESTS flag
        command: echo 'export GCO_GATE_TESTS=true' >> "$BASH_ENV"
- when:
    condition: << parameters.check_only >>
    steps:
    - run:
        name: Set GCO_CHECK_ONLY flag
        command: echo 'export GCO_CHECK_ONLY=true' >> "$BASH_ENV"
- when:
    condition: << parameters.dry_run >>
    steps:
    - run:
        name: Set GCO_DRY_RUN flag
        command: echo 'export GCO_DRY_RUN=true' >> "$BASH_ENV"
- run:
    name: Add complexity to coverage report
    command: <<include(scripts/complexity.sh)>>
    environment:
      GCO_FILE: << parameters.file >>
      GCO_LOG_LEVEL: << parameters.log_level >>
      GCO_OUTPUT: << parameters.output >>
      GCO_SOURCE_ROOT: << parameters.source_root >>
      GCO_DUPLICATES: << parameters.duplicates >>
      GCO_RULES: << parameters.rules >>
      GCO_UNMATCHED: << parameters.unmatched >>
      GCO_WARN_COMPLEXITY: << parameters.warn_complexity >>
      GCO_WARN_CRAP: << parameters.warn_crap >>
      GCO_MAX_COMPLEXITY: << parameters.max_complexity >>
      GCO_MAX_CRAP: << parameters.max_crap >>
      GCO_BASELINE: << parameters.baseline >>
      GCO_WRITE_BASELINE: << parameters.write_baseline >>
      GCO_SUMMARY_FILE: << parameters.summary_file >>
