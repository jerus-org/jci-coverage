description: 'Standalone: takes a coverage file path and uploads it. Does not require `report`, Rust, or `cargo-llvm-cov` — the caller is responsible for the file existing at the given path in a format OtterWise accepts. It must run in CircleCI: OtterWise shows only uploads that carry a CI identity, so elsewhere it refuses unless told to upload anyway (see the allow-local option).'
parameters:
  file:
    type: string
    description: Path to the coverage report to upload
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
  repo_token:
    type: string
    description: Repository token. Falls back to `OTTERWISE_TOKEN` when omitted.
    default: ''
  endpoint:
    type: string
    description: Override the upload endpoint (primarily for testing)
    default: ''
  allow_local:
    type: boolean
    description: 'Upload even when not running in CircleCI. OtterWise shows only uploads that carry a CI identity: from anywhere else it answers "Queued for processing" and the result never appears. Without this flag `upload` refuses to run outside CircleCI (`CIRCLECI` is not `true`).'
    default: false
steps:
- when:
    condition: << parameters.allow_local >>
    steps:
    - run:
        name: Set GCO_ALLOW_LOCAL flag
        command: echo 'export GCO_ALLOW_LOCAL=true' >> "$BASH_ENV"
- run:
    name: Upload coverage to OtterWise
    command: <<include(scripts/upload.sh)>>
    environment:
      GCO_FILE: << parameters.file >>
      GCO_LOG_LEVEL: << parameters.log_level >>
      GCO_REPO_TOKEN: << parameters.repo_token >>
      GCO_ENDPOINT: << parameters.endpoint >>
