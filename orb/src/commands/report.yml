description: Writes `coverage/lcov.info` and prints a terminal summary. Requires `cargo-llvm-cov` and the `llvm-tools` rustup component on PATH (and `cargo-nextest` too, when `--runner nextest` is selected).
parameters:
  package:
    type: string
    description: Limit coverage to one workspace package
    default: ''
  log_level:
    type: enum
    description: 'Logging verbosity: consolidates this tool''s clap-verbosity-flag -q/--quiet and -v/--verbose repeat-counters (its own linked pair) into one selector, so they can''t be set independently and cancel out. clap-verbosity-flag escalates off -> error -> warn -> info -> debug -> trace, typically starting at error: `quiet` is a single -q (one step quieter); `default` is this tool''s own starting point on that scale; `v` / `vv` / `vvv` / `vvvv` are -v / -vv / -vvv / -vvvv (one to four steps louder).'
    default: default
    enum:
    - quiet
    - default
    - v
    - vv
    - vvv
    - vvvv
  runner:
    type: enum
    description: Test runner to drive coverage with
    default: test
    enum:
    - test
    - nextest
  nextest_profile:
    type: string
    description: Nextest profile to use. Only meaningful with `--runner nextest`.
    default: ''
  no_all_features:
    type: boolean
    description: Disable `--all-features` (on by default). Matches `toolkit/code_coverage`, so instrumented subprocess coverage is captured.
    default: false
  dry_run:
    type: boolean
    description: 'Preview the cargo-llvm-cov invocation without running it. Works with zero tool setup: never fails on a missing tool or touches the filesystem. Still warns (without failing) when a required tool is missing.'
    default: false
steps:
- when:
    condition: << parameters.no_all_features >>
    steps:
    - run:
        name: Set GCO_NO_ALL_FEATURES flag
        command: echo 'export GCO_NO_ALL_FEATURES=true' >> "$BASH_ENV"
- when:
    condition: << parameters.dry_run >>
    steps:
    - run:
        name: Set GCO_DRY_RUN flag
        command: echo 'export GCO_DRY_RUN=true' >> "$BASH_ENV"
- run:
    name: Writes `coverage/lcov.info` and prints a terminal summary. Requires `cargo-llvm-cov` and the `llvm-tools` rustup component on PATH (and `cargo-nextest` too, when `--runner nextest` is selected).
    command: <<include(scripts/report.sh)>>
    environment:
      GCO_PACKAGE: << parameters.package >>
      GCO_LOG_LEVEL: << parameters.log_level >>
      GCO_RUNNER: << parameters.runner >>
      GCO_NEXTEST_PROFILE: << parameters.nextest_profile >>
