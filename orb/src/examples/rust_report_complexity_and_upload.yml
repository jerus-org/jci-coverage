description: >
  Rust project: generate coverage with cargo-llvm-cov, add cyclomatic
  complexity to its Cobertura report and upload it to OtterWise in one job, so
  OtterWise shows Complexity and CRAP as well as coverage.

  report_complexity_and_upload runs the tests once, writes the Cobertura
  report, annotates coverage/cobertura.xml with per-function complexity and
  uploads it. Set format: both to also write coverage/lcov.info for a later
  job; it is not uploaded. Rust only: complexity is computed from Rust source and matched
  to the functions cargo-llvm-cov names in its report. Set the OtterWise token
  as the OTTERWISE_TOKEN environment variable in each project's settings.
  Never pass a token as a parameter: it would be stored in your config and
  appear on the command line.

  To fail the build on an individual risky function, set max_complexity
  and/or max_crap (both 0, meaning off, by default). The check is a last step
  after the upload, so a failing gate still updates the dashboard. To adopt a
  maximum on existing code, commit a baseline made with `jci-coverage complexity
  --write-baseline` and set baseline: .jci-coverage-baseline; then only a new
  or worse function fails.

  Set pr_comment: true to also post the gate's result as one comment on the
  pull request, edited in place on each run, whether the gate passes or fails.
  The gate is the job's last step, so a job that fails earlier posts nothing
  and leaves any earlier comment as it was.
  It needs a maximum, and a GitHub token with permission to comment in the
  GITHUB_TOKEN environment variable, from a context or the project's environment
  variables. Never pass the token as a parameter. Nothing is posted for a build with no
  pull request or one from a fork, and a failure to post does not change the
  result.

  The default executor carries jci-coverage, cargo-llvm-cov and a Rust
  toolchain. If a prior job built the binary, set attach_workspace: true.
usage:
  version: 2.1
  orbs:
    jci-coverage: jerus-org/jci-coverage@0.0
  workflows:
    validation:
      jobs:
        - jci-coverage/report_complexity_and_upload
        # Optional parameters: runner: nextest, package: my-crate,
        # unmatched: fail (stop if a method cannot be matched), format: both, ...
        #
        # Fail on risky functions, allowing today's with a committed baseline:
        # - jci-coverage/report_complexity_and_upload:
        #     max_complexity: 15
        #     baseline: .jci-coverage-baseline
        #
        # Also comment the result on the pull request (GITHUB_TOKEN from a context;
        # needs an orb release that includes pr_comment, an older one rejects it):
        # - jci-coverage/report_complexity_and_upload:
        #     context: my-github-token-context
        #     max_complexity: 15
        #     baseline: .jci-coverage-baseline
        #     pr_comment: true
