description: Generate Rust coverage with cargo-llvm-cov (coverage/lcov.info) and upload it to OtterWise. Supply OTTERWISE_TOKEN (or OTTERWISE_ORG_TOKEN) through a context.
executor: default
parameters:
  package:
    type: string
    description: Limit coverage to one workspace package.
    default: ''
  runner:
    type: string
    description: 'Test runner to drive coverage with: test (cargo llvm-cov) or nextest (cargo llvm-cov nextest).'
    default: test
  nextest_profile:
    type: string
    description: Nextest profile to use. Only meaningful with runner nextest.
    default: ''
  no_all_features:
    type: boolean
    description: Disable --all-features (on by default).
    default: false
  log_level:
    type: string
    description: 'Logging verbosity for both steps: quiet, default, v, vv, vvv or vvvv.'
    default: default
steps:
- checkout
- report:
    log_level: << parameters.log_level >>
    nextest_profile: << parameters.nextest_profile >>
    no_all_features: << parameters.no_all_features >>
    package: << parameters.package >>
    runner: << parameters.runner >>
- upload:
    file: coverage/lcov.info
    log_level: << parameters.log_level >>
