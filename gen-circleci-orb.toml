[orb]
binary = "jci-coverage"
namespaces = ["jerus-org"]
orb_dir = "orb"
home_url = "https://github.com/jerus-org/jci-coverage"
source_url = "https://github.com/jerus-org/jci-coverage"
# `report` drives cargo-llvm-cov (and cargo-nextest for `--runner nextest`) as
# subprocesses, so the executor image must carry both. Installed via
# cargo-binstall into the generated Dockerfile, pinned for reproducible images.
# `llvm-tools-preview` is not pre-installed: cargo-llvm-cov adds it with rustup
# on first use when `CI` is set (CircleCI always sets it), which also covers a
# consumer's own rust-toolchain.toml selecting a different toolchain.
cargo_tools = ["cargo-llvm-cov@0.9.1", "cargo-nextest@0.9.146"]
# Digest-pinned base images, as in jci-audit: pinned here (not left to the
# generator's moving-tag default) so the @sha256 survives every regeneration.
builder_image = "rust:1-slim-trixie@sha256:70d3b1a5e21806b8615c3fb2a59abea6e931aa29bf93f0a9d9c46e743beae096"
# The runtime needs a full Rust toolchain, not just the tool binaries: `report`
# compiles and runs the consumer's test suite under instrumentation. Same image
# and digest as the builder stage.
base_image = "rust:1-slim-trixie@sha256:70d3b1a5e21806b8615c3fb2a59abea6e931aa29bf93f0a9d9c46e743beae096"
# Hand-authored orb files the generator does not produce; without this the
# prune step would delete them as orphans on the next `generate`.
custom_files = [
    "src/examples/rust_report_and_upload.yml",
    "src/examples/upload_only.yml",
]

[ci]
build_workflow = "validation"
release_workflow = "release"
requires_job = "toolkit/common_tests"
release_after_job = "release-jci-coverage"
crate_tag_prefix = "jci-coverage-v"
# Release gate (gen-circleci-orb#462): release.yml's release workflow checks,
# packs and reviews the orb about to be released before approve-release can
# be given. `update` adds the gate jobs; approve-release's `requires:` names
# release-gate-review-orb by hand (update verifies it, never edits it).
release_gate_before = "approve-release"
docker_namespace = "jerusdp"
docker_context = "docker"
orb_context = "orb-publishing"
mcp = false
# Compile build-binary in the same executor as the workspace's other test jobs.
build_executor = "toolkit/rust_env_rolling"

# Commit the regenerated orb source back to the PR branch (signed), so the
# published orb stays in sync with the CLI and changes are reviewable pre-merge.
# Values are env-var *names* (secrets live in the `release` context), except the
# SSH fingerprint, which add_ssh_keys resolves at config-compile time. Same org
# bot key as jci-audit and gen-circleci-orb — it must also be added to this
# repo's CircleCI project settings (Additional SSH Keys).
[record]
enabled = true
gpg_key_env = "BOT_GPG_KEY"
gpg_trust_env = "BOT_TRUST"
user_name_env = "BOT_USER_NAME"
user_email_env = "BOT_USER_EMAIL"
signing_key_env = "BOT_SIGN_KEY"
push_ssh_fingerprint = "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
contexts = ["release"]

# Check-only post-merge chain (gen-circleci-orb#462): after a Renovate PR
# merges, build the binary fresh, run `generate --check` against main, then
# pack and review the committed orb. Nothing is recorded or pushed to main.
# Renovate branches skip the validation workflow's orb jobs (skip patterns
# default to branch_patterns): a regen commit on a bot branch makes Renovate
# stop rebasing it (gen-circleci-orb#326/#328), and this check covers what
# merged. Runs last in this repo's "PR merged"-triggered update_prlog
# workflow, after toolkit/update_prlog.
[post_merge_check]
branch_patterns = ["renovate/*"]
workflow = "update_prlog"
file = "update_prlog.yml"

# The drop-in replacement for circleci-toolkit's code_coverage job: generate and
# upload in one job. `report` writes coverage/lcov.info into its own job's
# working directory, so a separate `upload` job would need a workspace hand-off;
# composing both here avoids that. Simple mode (steps + params), not rich mode:
# the exposed job parameters are derived from the commands themselves, so
# `runner` and `log_level` keep their enum types. Tokens are deliberately NOT
# exposed: `upload` falls back to OTTERWISE_TOKEN / OTTERWISE_ORG_TOKEN, which a
# consumer sets as a per-project environment variable (the token
# differs for each repo, so it is not shared through a context).
[[job_group]]
name = "report_and_upload"
description = "Generate Rust coverage with cargo-llvm-cov (coverage/lcov.info) and upload it to OtterWise. Set OTTERWISE_TOKEN (or OTTERWISE_ORG_TOKEN) as a project environment variable."
steps = ["report", "upload"]
params = ["package", "runner", "nextest_profile", "no_all_features", "log_level"]

# Curated step names: without a label the generator uses the first paragraph of
# each subcommand's `--help`, which for these is the whole long description.
[subcommand.report]
label = "Generate coverage report"

[subcommand.upload]
label = "Upload coverage to OtterWise"

# `report` always writes coverage/lcov.info, so make that `upload`'s default.
# gen-circleci-orb >= 0.1.28 applies this to report_and_upload's `file` too
# (gen-circleci-orb#458), so the composed job no longer requires it; the
# standalone `upload` job gets the same default.
[subcommand.upload.param.file]
default = "coverage/lcov.info"
