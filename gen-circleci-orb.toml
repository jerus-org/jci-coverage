[orb]
binary = "jci-coverage"
namespaces = ["jerus-org"]
orb_dir = "orb"
home_url = "https://github.com/jerus-org/jci-coverage"
source_url = "https://github.com/jerus-org/jci-coverage"
# Digest-pinned builder image, as in jci-audit: pinned here (not left to the
# generator's moving-tag default) so the @sha256 survives every regeneration.
# Only the builder stage uses it: the runtime stage is the generator's slim
# default, with no Rust toolchain, since `complexity` and `upload` compile
# nothing and run no tests.
builder_image = "rust:1-slim-trixie@sha256:7eab7ce19273ce785e0ca7578bdf7bc1fcbae621775a8197379a04c9f6e03cd5"
# Hand-authored orb files the generator does not produce; without this the
# prune step would delete them as orphans on the next `generate`.
custom_files = [
    "src/examples/rust_complexity_and_upload.yml",
    "src/examples/upload_only.yml",
]

[ci]
build_workflow = "validation"
release_workflow = "release"
requires_job = "toolkit/common_tests"
crate_tag_prefix = "jci-coverage-v"
# Release gate (gen-circleci-orb#462): release.yml's release workflow checks,
# packs and reviews the orb about to be released before approve-release can
# be given. `update` adds the gate jobs; approve-release's `requires:` names
# release-gate-review-orb by hand (update verifies it, never edits it).
release_gate_before = "approve-release"
docker_namespace = "jerusdp"
docker_context = "docker"
orb_context = "orb-publishing"
mcp = false
# Compile build-binary in the same executor as the workspace's other test jobs.
build_executor = "toolkit/rust_env_rolling"

# Commit the regenerated orb source back to the PR branch (signed), so the
# published orb stays in sync with the CLI and changes are reviewable pre-merge.
# Values are env-var *names* (secrets live in the `release` context), except the
# SSH fingerprint, which add_ssh_keys resolves at config-compile time. Same org
# bot key as jci-audit and gen-circleci-orb — it must also be added to this
# repo's CircleCI project settings (Additional SSH Keys).
[record]
enabled = true
gpg_key_env = "BOT_GPG_KEY"
gpg_trust_env = "BOT_TRUST"
user_name_env = "BOT_USER_NAME"
user_email_env = "BOT_USER_EMAIL"
signing_key_env = "BOT_SIGN_KEY"
push_ssh_fingerprint = "SHA256:OkxsH8Z6Iim6WDJBaII9eTT9aaO1f3eDc6IpsgYYPVg"
contexts = ["release"]

# Check-only post-merge chain (gen-circleci-orb#462): after a Renovate PR
# merges, build the binary fresh, run `generate --check` against main, then
# pack and review the committed orb. Nothing is recorded or pushed to main.
# Renovate branches skip the validation workflow's orb jobs (skip patterns
# default to branch_patterns): a regen commit on a bot branch makes Renovate
# stop rebasing it (gen-circleci-orb#326/#328), and this check covers what
# merged. Runs last in this repo's "PR merged"-triggered update_prlog
# workflow, after toolkit/update_prlog.
[post_merge_check]
branch_patterns = ["renovate/*"]
workflow = "update_prlog"
file = "update_prlog.yml"

# Curated step names: without a label the generator uses the first paragraph of
# each subcommand's `--help`, which for these is the whole long description.
[subcommand.complexity]
label = "Add complexity to coverage report"

[subcommand.upload]
label = "Upload coverage to OtterWise"

# `upload` standalone defaults to the lcov report that `cargo llvm-cov --lcov`
# writes (and the toolkit's `code_coverage` persists), for a project that sends
# the report as it is. `complexity_and_upload` below sets its own `file`.
[subcommand.upload.param.file]
default = "coverage/lcov.info"

# The default job for a Rust project (jerus-org/jci-coverage#117). Making the
# coverage report means compiling and running the consumer's tests under
# instrumentation, which needs the consumer's own toolchain and native libraries
# (a workspace that links openssl needs pkg-config and libssl-dev), and no job
# here takes an executor. `complexity` and `upload` compile nothing: they need only
# the report and the source files, so the orb's slim image always suffices for
# them. This job therefore starts from a report the consumer's own job wrote with
# `cargo llvm-cov` and persisted to the workspace (the toolkit's `code_coverage`
# job does this), adds complexity, uploads it, and runs the gate. Rich mode:
# hand-maintained, so keep the parameters it shares with `complexity` and `upload`
# in step with them. `attach_workspace` is declared here, defaulting to true,
# because the built-in step's own parameter defaults to false and the report
# arrives in the workspace; a declared parameter takes precedence over the one the
# built-in injects.
[[job_group]]
name = "complexity_and_upload"
description = "The default job for a Rust project. Add cyclomatic complexity to a coverage report that an earlier job wrote with cargo llvm-cov and persisted to the workspace, and upload it to OtterWise, which then shows Complexity and CRAP. The report may be Cobertura (cargo llvm-cov --cobertura) or lcov (cargo llvm-cov --lcov), which is converted. Takes the report instead of making it, so it needs none of the project's build dependencies in the orb's image. Rust only. Set OTTERWISE_TOKEN as a project environment variable."

[[job_group.parameter]]
name = "file"
default = "coverage/cobertura.xml"
description = "The coverage report, relative to workspace_root, as the earlier job persisted it: a Cobertura report written by `cargo llvm-cov --cobertura --output-path coverage/cobertura.xml`, or an lcov report written by `cargo llvm-cov --lcov --output-path coverage/lcov.info`. The format is told from the content."

[[job_group.parameter]]
name = "output"
default = "coverage/cobertura.xml"
description = "Where to write the annotated Cobertura report, relative to workspace_root; it is what is uploaded and checked. The default is also the default of `file`, so a Cobertura report is annotated in place. An lcov `file` is never replaced: set `file` to the lcov report and leave this."

[[job_group.parameter]]
name = "attach_workspace"
type = "boolean"
default = "true"
description = "Attach the workspace that holds the report. Leave on: the report is persisted by an earlier job. Turn off only if that job's output is already in the job's working directory."

[[job_group.parameter]]
name = "unmatched"
enum = ["keep", "one", "fail"]
default = "keep"
description = "What to do with a method that has no matching function in the source. `fail` stops the job, so a run where complexity silently stays 0 is not reported as a success."

[[job_group.parameter]]
name = "exclude_tests"
type = "boolean"
default = "false"
description = "Count `#[cfg(test)]` code and `#[test]` functions as complexity 0"

[[job_group.parameter]]
name = "source_root"
default = "."
description = "Directory the report's source file paths are relative to"

[[job_group.parameter]]
name = "rules"
enum = ["rca", "mccabe"]
default = "rca"
description = "Which decision points count"

[[job_group.parameter]]
name = "warn_complexity"
default = "10"
description = "Warn about each function whose cyclomatic complexity is at least this. 0 turns the check off"

[[job_group.parameter]]
name = "warn_crap"
default = "30"
description = "Warn about each function whose CRAP score is at least this. 0 turns the check off"

[[job_group.parameter]]
name = "max_complexity"
default = "0"
description = "Fail the job, after the upload, if any function's cyclomatic complexity is at least this. 0 (the default) turns the check off"

[[job_group.parameter]]
name = "max_crap"
default = "0"
description = "Fail the job, after the upload, if any function's CRAP score is at least this. 0 (the default) turns the check off"

[[job_group.parameter]]
name = "baseline"
default = ""
description = "Path of a committed baseline of the functions allowed to stay over a maximum, such as `.jci-coverage-baseline`, made with `jci-coverage complexity --write-baseline`. A baselined function fails only if it gets worse. Empty means no baseline"

[[job_group.parameter]]
name = "pr_comment"
type = "boolean"
default = "false"
description = "Post the gate's result as a comment on the pull request, and keep it up to date: one comment, edited in place on each run, whether the gate passes or fails. The gate is the job's last step, after the upload, so a job that fails earlier posts nothing and leaves any earlier comment as it was. Needs a maximum, and a GitHub token with permission to comment in GITHUB_TOKEN, from a context or the project's environment variables (never a parameter). Nothing is posted, and the reason is logged, for a build with no pull request or a pull request from a fork, which gets neither. A failure to post is a warning and does not change the result. Needs an orb release that includes this parameter."

[[job_group.parameter]]
name = "max_listed"
default = "0"
description = "List at most this many of the failing functions, worst first, in the failure report and in the pull request comment. The headline still counts all of them and says how many are not listed. 0 (the default) lists them all; a comment too long for GitHub is cut to fit whatever this says. Needs an orb release that includes this parameter."

[[job_group.parameter]]
name = "failures_file"
default = ""
description = "Where to put every failing function, as a markdown task list one to a line, worst first, whatever max_listed says: a list to copy from when tracking the failures as issues, however many there are. Set it to `-` to have the whole list at the end of the failure report in the job log. A file path is written when the gate fails and kept as a job artifact. Empty adds nothing. Needs an orb release that includes this parameter."

[[job_group.parameter]]
name = "gate_tests"
type = "boolean"
default = "false"
description = "Judge `#[cfg(test)]` code and `#[test]` functions against the warning and maximum thresholds too"

[[job_group.parameter]]
name = "log_level"
enum = ["quiet", "default", "v", "vv", "vvv", "vvvv"]
default = "default"
description = "Logging verbosity, from `quiet` to `vvvv` (most verbose)."

[[job_group.step]]
builtin = "checkout"

[[job_group.step]]
builtin = "attach_workspace"

[[job_group.step]]
command = "complexity"
defaults = ["duplicates", "no_rollup", "dry_run", "max_complexity", "max_crap", "baseline", "write_baseline", "check_only", "summary_file", "pr_comment", "max_listed", "failures_file"]

[job_group.step.with]
file = "<< parameters.workspace_root >>/<< parameters.file >>"
output = "<< parameters.workspace_root >>/<< parameters.output >>"
source_root = "<< parameters.source_root >>"
rules = "<< parameters.rules >>"
unmatched = "<< parameters.unmatched >>"
exclude_tests = "<< parameters.exclude_tests >>"
warn_complexity = "<< parameters.warn_complexity >>"
warn_crap = "<< parameters.warn_crap >>"
gate_tests = "<< parameters.gate_tests >>"
log_level = "<< parameters.log_level >>"

[[job_group.step]]
command = "upload"
defaults = ["repo_token", "endpoint"]

[job_group.step.with]
file = "<< parameters.workspace_root >>/<< parameters.output >>"
log_level = "<< parameters.log_level >>"

# The gate: a second `complexity` step after `upload` (jerus-org/jci-coverage#52),
# so a function over a maximum fails the job once the upload has happened and the
# dashboard shows the failing state. `--check-only` leaves the report as it is and
# does not repeat the summary or the warnings; with every maximum off (the
# default) it has nothing to check and succeeds. `pr_comment`, `max_listed` and
# `failures_file` are the gate's: the summary it posts and the failures it lists
# are the gate's result. A file path is kept by the `store_artifacts` step that
# follows (jerus-org/gen-circleci-orb#527), which runs even though this step
# failed. `pr_comment` needs `GITHUB_TOKEN` from the environment or a context
# (never a parameter, which would be stored in the consumer's config).
[[job_group.step]]
command = "complexity"
defaults = ["output", "duplicates", "no_rollup", "dry_run", "unmatched", "exclude_tests", "warn_complexity", "warn_crap", "write_baseline", "summary_file"]

[job_group.step.with]
file = "<< parameters.workspace_root >>/<< parameters.output >>"
check_only = "true"
source_root = "<< parameters.source_root >>"
rules = "<< parameters.rules >>"
max_complexity = "<< parameters.max_complexity >>"
max_crap = "<< parameters.max_crap >>"
baseline = "<< parameters.baseline >>"
pr_comment = "<< parameters.pr_comment >>"
max_listed = "<< parameters.max_listed >>"
failures_file = "<< parameters.failures_file >>"
gate_tests = "<< parameters.gate_tests >>"
log_level = "<< parameters.log_level >>"

# Keep the failures file, when a path was given (jerus-org/jci-coverage#65).
[[job_group.step]]
builtin = "store_artifacts"
condition = "failures_file"

[job_group.step.with]
path = "<< parameters.failures_file >>"
